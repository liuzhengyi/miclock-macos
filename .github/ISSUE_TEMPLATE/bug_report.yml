name: Bug report
description: Describe a MicLock problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Prefer “Report an Issue…” inside MicLock. It automatically attaches diagnostics that you can preview or exclude. GitHub issues are public; review anything you share here.
  - type: textarea
    id: description
    attributes:
      label: What went wrong?
      description: A short description is enough. If useful, mention what you were doing and what you expected.
      placeholder: Describe the problem in your own words.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics (optional)
      description: Use “Copy Redacted Diagnostics” in MicLock, review the output, and paste it here only if you want to share it. Do not attach recordings, personal text, account details, credentials, or raw device listings.
      render: text
    validations:
      required: false
